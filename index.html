<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMEP · Live Photography</title>
  <meta name="description" content="UMEP — Live concert photography portfolio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>
  <!-- ================================================================
       Deep-sea light field (monochrome god-rays)
       ================================================================ -->
  <div class="deepsea-lights" aria-hidden="true">
    <span class="ray ray-1"></span>
    <span class="ray ray-2"></span>
    <span class="ray ray-3"></span>
    <span class="ray ray-4"></span>
    <span class="ray ray-5"></span>
    <div class="caustic caustic-a"></div>
    <div class="caustic caustic-b"></div>
  </div>

  <!-- ================================================================
       Site header
       ================================================================ -->
  <header class="site-header">
    <a href="#top" class="logo">UMEP</a>
    <nav class="nav">
      <a href="#work">WORK</a>
      <a href="#about">ABOUT</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>

  <!-- ================================================================
       Work — all photos flowing freely
       ================================================================ -->
  <main id="top">
    <section id="work" class="work">
      <div id="photo-grid" class="photo-grid" aria-label="UMEP photo archive"></div>
      <div class="grid-loading" id="grid-loading">Loading photos…</div>
    </section>
  </main>

  <!-- ================================================================
       Lightbox
       ================================================================ -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox__close" id="lb-close" aria-label="Close">×</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lb-prev" aria-label="Previous">‹</button>
    <button class="lightbox__nav lightbox__nav--next" id="lb-next" aria-label="Next">›</button>
    <figure class="lightbox__inner">
      <img id="lb-image" alt="">
      <figcaption class="lightbox__caption">
        <div class="lb-caption__row">
          <span class="lb-caption__tag" id="lb-tag">LIVE</span>
          <span class="lb-caption__idx" id="lb-idx">000 / 508</span>
        </div>
        <h3 class="lb-caption__title" id="lb-title"></h3>
        <p class="lb-caption__sub" id="lb-sub"></p>
        <p class="lb-caption__desc" id="lb-desc"></p>
      </figcaption>
    </figure>
  </div>

  <!-- ================================================================
       About
       ================================================================ -->
  <section id="about" class="about">
    <header class="section-heading">
      <span class="section-heading__tag">ABOUT</span>
      <h2 class="section-heading__title">Photographer</h2>
    </header>
    <div class="about__body">
      <p>
        UMEP — 光と静寂を撮るライブフォトグラファー。<br>
        A live photographer capturing light and stillness on stage.
      </p>
    </div>
  </section>

  <!-- ================================================================
       Contact
       ================================================================ -->
  <section id="contact" class="contact">
    <header class="section-heading">
      <span class="section-heading__tag">CONTACT</span>
      <h2 class="section-heading__title">Get in touch</h2>
      <p class="section-heading__meta">Commissions · Press · Prints</p>
    </header>
    <form
      id="contact-form"
      class="contact-form"
      action="https://formsubmit.co/zarunekodori@gmail.com"
      method="POST"
    >
      <input type="hidden" name="_subject" value="UMEP portfolio — new inquiry">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" style="display:none">

      <label class="field">
        <span class="field__label">NAME</span>
        <input type="text" name="name" required autocomplete="name">
      </label>
      <label class="field">
        <span class="field__label">EMAIL</span>
        <input type="email" name="email" required autocomplete="email">
      </label>
      <label class="field field--full">
        <span class="field__label">MESSAGE</span>
        <textarea name="message" rows="5" required></textarea>
      </label>
      <button type="submit" class="btn-submit">SEND</button>
    </form>
  </section>

  <footer class="site-footer">
    <span>© UMEP</span>
    <span>Dreamfield · Live Series</span>
  </footer>

  <script src="script.js?v=16"></script>
</body>
</html>
